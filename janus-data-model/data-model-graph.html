<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Janus — Data Model Graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1c2230;
    --border: #2a3142;
    --border-2: #3a4358;
    --text: #e6edf3;
    --text-dim: #9aa7b8;
    --text-mute: #5c6675;
    --accent: #58a6ff;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    overflow: hidden;
  }
  #graph {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at 40% 30%, #131a26 0%, #0d1117 70%);
  }
  svg.graph {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  svg.graph:active { cursor: grabbing; }

  /* Legend / sidebar */
  #sidebar {
    width: 300px;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sb-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sb-title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  #brand { padding: 18px 16px; border-bottom: 1px solid var(--border); }
  #brand h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  #brand p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  #search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-2);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search-results { max-height: 160px; overflow-y: auto; margin-top: 6px; display: none; }
  #search-results.active { display: block; }
  .search-item {
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
  }
  .search-item:hover { background: var(--bg-3); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #info-panel { min-height: 150px; }
  #info-content { font-size: 12px; color: var(--text-dim); line-height: 1.55; }
  #info-content .tname { color: var(--text); font-weight: 600; font-size: 14px; display: block; margin-bottom: 2px; }
  #info-content .tdomain { font-size: 11px; color: var(--text-mute); margin-bottom: 8px; display: block; }
  #info-content .cols-label { color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 0 4px; }
  #info-content .col { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--text); padding: 1px 0; }
  #info-content .col .pk { color: #ffd166; font-weight: 600; }
  #info-content .col .fk { color: #56d364; }
  #info-content .col .uq { color: #ff7b72; }
  #info-content .empty { color: var(--text-mute); font-style: italic; font-size: 12px; }

  .legend-item {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .legend-item:hover { background: var(--bg-3); }
  .legend-item.dimmed { opacity: 0.4; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .legend-count { color: var(--text-mute); font-size: 11px; }

  #legend-wrap { flex: 1; overflow-y: auto; }
  #legend-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-dim); user-select: none; }
  #legend-controls label:hover { color: var(--text); }
  input[type="checkbox"].cb {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; border: 1.5px solid var(--border-2);
    border-radius: 3px; background: var(--bg); cursor: pointer; position: relative; flex-shrink: 0;
  }
  input[type="checkbox"].cb:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"].cb:checked::after {
    content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  #stats { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-mute); }

  /* controls overlay */
  #controls {
    position: absolute; top: 14px; left: 14px;
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: flex; gap: 4px;
    backdrop-filter: blur(6px);
  }
  #controls button {
    background: transparent; color: var(--text-dim); border: 1px solid transparent;
    border-radius: 5px; padding: 5px 9px; font-size: 12px; cursor: pointer; line-height: 1;
  }
  #controls button:hover { background: var(--bg-3); color: var(--text); }
  #controls button.active { background: var(--bg-3); color: var(--accent); }

  /* SVG node / edge styles */
  .node { cursor: pointer; }
  .node circle { stroke: rgba(255,255,255,0.25); stroke-width: 1.4px; transition: stroke 0.12s, stroke-width 0.12s; }
  .node text {
    font-size: 11px; font-weight: 500; fill: var(--text);
    pointer-events: none; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }
  .node.dimmed { opacity: 0.12; }
  .node.focused circle { stroke: #fff; stroke-width: 3px; }
  .node.selected circle { stroke: var(--accent); stroke-width: 3px; }

  .link { fill: none; stroke: #2f3a52; stroke-width: 1.2px; transition: stroke 0.12s, stroke-width 0.12s; }
  .link.dimmed { opacity: 0.06; }
  .link.highlighted { stroke: #58a6ff; stroke-width: 2.4px; }
  .link-label {
    font-size: 9px; fill: #6b7a90; pointer-events: none; user-select: none;
    opacity: 0; transition: opacity 0.12s;
  }
  .link-label.visible { opacity: 0.95; }

  /* tooltip */
  #tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: rgba(13, 17, 23, 0.97);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px; color: var(--text);
    max-width: 280px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    transition: opacity 0.1s;
    z-index: 50;
  }
  #tooltip .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  #tooltip .tt-domain { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  #tooltip .tt-cols { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; line-height: 1.5; }
  #tooltip .tt-cols .pk { color: #ffd166; }
  #tooltip .tt-cols .fk { color: #56d364; }
  #tooltip .tt-cols .uq { color: #ff7b72; }
  #tooltip .tt-fk { color: #56d364; font-size: 11px; margin-top: 6px; border-top: 1px solid var(--border); padding-top: 5px; }

  .edge-marker { fill: #2f3a52; }
</style>
</head>
<body>
<div id="graph">
  <div id="controls">
    <button id="btn-zoom-in" title="Zoom in">＋</button>
    <button id="btn-zoom-out" title="Zoom out">－</button>
    <button id="btn-fit" title="Fit to view">⤢</button>
    <button id="btn-labels" class="active" title="Toggle edge labels">FK</button>
    <button id="btn-relayout" title="Re-run layout">⟳</button>
  </div>
  <svg class="graph"></svg>
  <div id="tooltip"></div>
</div>

<div id="sidebar">
  <div id="brand">
    <h1>Janus · Data Model</h1>
    <p>Postgres schema — 30 tables, 8 domains</p>
  </div>
  <div class="sb-section">
    <div class="sb-title">Search tables</div>
    <input id="search" type="text" placeholder="Filter tables…" autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div class="sb-section" id="info-panel">
    <div class="sb-title">Table detail</div>
    <div id="info-content"><span class="empty">Click a table to inspect its columns &amp; relationships.</span></div>
  </div>
  <div id="legend-wrap">
    <div class="sb-section" style="border-bottom:none;">
      <div class="sb-title">Domains</div>
      <div id="legend-controls">
        <label><input type="checkbox" class="cb" id="select-all" checked><span id="select-all-label">Select all</span></label>
      </div>
      <div id="legend"></div>
    </div>
  </div>
  <div id="stats">30 tables · 52 FK edges · 8 domains</div>
</div>

  ["product_signal","deal","deal_id"],
  ["product_signal","account","account_id"],
  ["product_signal","user","owner_user_id"],
  ["product_signal","user","reviewed_by"],
  ["product_signal","signal_cluster","cluster_id"],
  ["coaching_focus","user","se_user_id"],
  ["coaching_focus","user","set_by_user_id"],
  ["coaching_focus","rubric_theme","rubric_theme_id"],
  ["coaching_reflection","user","se_user_id"],
  ["coaching_reflection","coaching_focus","coaching_focus_id"],
  ["coaching_reflection","activity","activity_id"],
  ["coaching_recommendation","user","se_user_id"],
  ["coaching_recommendation","rubric_theme","rubric_theme_id"],
  ["sync_job","integration","integration_id"],
  ["webhook_event","integration","integration_id"],
  ["ai_run","activity","activity_id"],
  ["audit_log","user","user_id"],
];

const tableByDomain = {};
TABLES.forEach(t => { (tableByDomain[t.d] ||= []).push(t.t); });

// ============================================================
// HTML-escape helper
// ============================================================
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ============================================================
// Build graph data
// ============================================================
const nodes = TABLES.map(t => {
  const fkCount = t.cols.filter(c => c.f && c.f.includes("fk")).length;
  return {
    id: t.t,
    label: t.t,
    domain: t.d,
    color: DOMAIN_COLOR[t.d],
    cols: t.cols,
    fkCount,
    degree: 0,
  };
});
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

const links = EDGES.map((e, i) => {
  const [from, to, via] = e;
  return { id: "e" + i, source: from, target: to, via, sameDomain: nodeById[from].domain === nodeById[to].domain };
});
links.forEach(l => { nodeById[l.source].degree++; nodeById[l.target].degree++; });

// node radius: scaled by degree
nodes.forEach(n => { n.r = 11 + Math.min(n.degree, 8) * 1.5; });

document.getElementById("stats").textContent =
  `${nodes.length} tables · ${links.length} FK edges · ${DOMAINS.length} domains`;

// ============================================================
// SVG setup
// ============================================================
const container = document.getElementById("graph");
const svg = d3.select("svg.graph");
const tooltip = document.getElementById("tooltip");

let width = container.clientWidth;
let height = container.clientHeight;
svg.attr("viewBox", `0 0 ${width} ${height}`);

// defs for arrowhead markers (one per domain color + a neutral)
const defs = svg.append("defs");
const markerColors = [...new Set(DOMAINS.map(d => d.color))];
markerColors.forEach((c, i) => {
  defs.append("marker")
    .attr("id", "arrow-" + i)
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 9).attr("refY", 0)
    .attr("markerWidth", 7).attr("markerHeight", 7)
    .attr("orient", "auto")
    .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", c).attr("class", "edge-marker");
});
// generic muted marker for non-highlighted edges
defs.append("marker")
  .attr("id", "arrow-mute")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 9).attr("refY", 0)
  .attr("markerWidth", 7).attr("markerHeight", 7)
  .attr("orient", "auto")
  .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#2f3a52");

const colorIdx = {};
markerColors.forEach((c, i) => colorIdx[c] = i);

const g = svg.append("g").attr("class", "zoom-layer");

const linkG = g.append("g").attr("class", "links");
const labelG = g.append("g").attr("class", "link-labels");
const nodeG = g.append("g").attr("class", "nodes");

// ============================================================
// Force simulation
// ============================================================
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(l => l.sameDomain ? 70 : 130)
    .strength(l => l.sameDomain ? 0.6 : 0.25))
  .force("charge", d3.forceManyBody().strength(-380))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collide", d3.forceCollide().radius(d => d.r + 14))
  .force("x", d3.forceX(width / 2).strength(0.04))
  .force("y", d3.forceY(height / 2).strength(0.06))
  .alphaDecay(0.025);

// Draw links
const link = linkG.selectAll("path")
  .data(links)
  .join("path")
  .attr("class", "link")
  .attr("marker-end", "url(#arrow-mute)");

// Curved link path generator (avoids node overlap)
function linkPath(d) {
  const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
  const dx = tx - sx, dy = ty - sy;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  // trim endpoints by node radius so arrow lands on border
  const sR = (d.source.r || 12) + 2;
  const tR = (d.target.r || 12) + 4;
  const x1 = sx + ux * sR, y1 = sy + uy * sR;
  const x2 = tx - ux * tR, y2 = ty - uy * tR;
  // mild quadratic curve offset perpendicular
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const off = Math.min(34, Math.hypot(x2 - x1, y2 - y1) * 0.12);
  const px = -uy * off, py = ux * off;
  return `M${x1},${y1} Q${mx + px},${my + py} ${x2},${y2}`;
}

// Edge labels (FK column name)
const linkLabel = labelG.selectAll("text")
  .data(links)
  .join("text")
  .attr("class", "link-label visible")
  .attr("text-anchor", "middle")
  .attr("dy", -4)
  .text(d => d.via);

let showLabels = true;

// Drag handlers
function dragstarted(event, d) {
  if (!event.active) sim.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragended(event, d) {
  if (!event.active) sim.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Draw nodes
const node = nodeG.selectAll("g.node")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

node.append("circle")
  .attr("r", d => d.r)
  .attr("fill", d => d.color);

node.append("text")
  .attr("dy", d => d.r + 13)
  .attr("text-anchor", "middle")
  .text(d => d.label);

// ============================================================
// Tick
// ============================================================
sim.on("tick", () => {
  link.attr("d", linkPath);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
});

sim.alpha(1).restart();

// ============================================================
// Zoom + pan
// ============================================================
const zoom = d3.zoom()
  .scaleExtent([0.15, 6])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

function fit() {
  const bounds = g.node().getBBox();
  if (!isFinite(bounds.width) || bounds.width === 0) return;
  const pad = 60;
  const scale = Math.min((width - pad * 2) / bounds.width, (height - pad * 2) / bounds.height, 1.4);
  const tx = (width - bounds.width * scale) / 2 - bounds.x * scale;
  const ty = (height - bounds.height * scale) / 2 - bounds.y * scale;
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}
window.addEventListener("resize", () => {
  width = container.clientWidth; height = container.clientHeight;
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  sim.force("center", d3.forceCenter(width/2, height/2));
  sim.force("x", d3.forceX(width/2).strength(0.04));
  sim.force("y", d3.forceY(height/2).strength(0.06));
  sim.alpha(0.3).restart();
});

// ============================================================
// Controls
// ============================================================
document.getElementById("btn-zoom-in").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.35);
document.getElementById("btn-zoom-out").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1/1.35);
document.getElementById("btn-fit").onclick = fit;
document.getElementById("btn-relayout").onclick = () => sim.alpha(1).restart();
const btnLabels = document.getElementById("btn-labels");
btnLabels.onclick = () => {
  showLabels = !showLabels;
  btnLabels.classList.toggle("active", showLabels);
  labelG.style("display", showLabels ? null : "none");
};

// ============================================================
// Interactions: hover, click, search, legend
// ============================================================
let selectedId = null;

const connected = new Map(); // nodeId -> Set of neighbor node ids
links.forEach(l => {
  const s = typeof l.source === "object" ? l.source.id : l.source;
  const t = typeof l.target === "object" ? l.target.id : l.target;
  if (!connected.has(s)) connected.set(s, new Set());
  if (!connected.has(t)) connected.set(t, new Set());
  connected.get(s).add(t);
  connected.get(t).add(s);
});

function highlightNeighbors(id) {
  const neigh = connected.get(id) || new Set();
  node.classed("dimmed", d => d.id !== id && !neigh.has(d.id))
      .classed("focused", d => neigh.has(d.id))
      .classed("selected", d => d.id === id);
  link.classed("dimmed", d => {
      const s = d.source.id || d.source, t = d.target.id || d.target;
      return s !== id && t !== id;
    })
    .classed("highlighted", d => {
      const s = d.source.id || d.source, t = d.target.id || d.target;
      return s === id || t === id;
    })
    .attr("marker-end", d => {
      const s = d.source.id || d.source, t = d.target.id || d.target;
      return (s === id || t === id) ? `url(#arrow-${colorIdx[nodeById[t].color]})` : "url(#arrow-mute)";
    });
}

function clearHighlight() {
  node.classed("dimmed", false).classed("focused", false).classed("selected", false);
  link.classed("dimmed", false).classed("highlighted", false).attr("marker-end", "url(#arrow-mute)");
}

function colHTML(c) {
  let cls = "";
  let tag = "";
  if (c.f && c.f.includes("pk")) { cls = "pk"; tag = "PK "; }
  else if (c.f && c.f.includes("fk")) { cls = "fk"; tag = "FK "; }
  else if (c.f && c.f.includes("uq")) { cls = "uq"; tag = "UQ "; }
  const typeStr = c.type ? ` <span style="color:#7d8590">:${c.type}</span>` : "";
  const note = c.note ? ` <span style="color:#a5d6ff">[${esc(c.note)}]</span>` : "";
  return `<div class="col"><span class="${cls}">${tag}</span>${esc(c.n)}${typeStr}${note}</div>`;
}

function showInfo(id) {
  const n = nodeById[id];
  if (!n) return;
  const neigh = [...(connected.get(id) || [])];
  const inLinks = links.filter(l => (l.target.id || l.target) === id);
  const outLinks = links.filter(l => (l.source.id || l.source) === id);
  let fkHTML = "";
  const fkRows = [
    ...outLinks.map(l => ({ from: id, to: (l.target.id||l.target), via: l.via, dir: "→" })),
    ...inLinks.map(l => ({ from: (l.source.id||l.source), to: id, via: l.via, dir: "←" })),
  ];
  if (fkRows.length) {
    fkHTML = `<div class="cols-label">Foreign keys (${fkRows.length})</div>` +
      fkRows.map(r => `<div class="col"><span class="fk">FK</span> ${esc(r.from)} ${r.dir} ${esc(r.to)} <span style="color:#7d8590">via ${esc(r.via)}</span></div>`).join("");
  }
  const colsHTML = `<div class="cols-label">Columns (${n.cols.length})</div>` +
    n.cols.map(colHTML).join("");
  document.getElementById("info-content").innerHTML =
    `<span class="tname">${esc(n.label)}</span>` +
    `<span class="tdomain" style="color:${n.color}">${esc(DOMAIN_LABEL[n.domain])}</span>` +
    colsHTML + fkHTML;
}

function focusNode(id) {
  selectedId = id;
  highlightNeighbors(id);
  showInfo(id);
  const n = nodeById[id];
  if (n && n.x != null) {
    const transform = d3.zoomTransform(svg.node());
    const [cx, cy] = [width / 2, height / 2];
    const scale = Math.max(transform.k, 1.2);
    const tx = cx - n.x * scale, ty = cy - n.y * scale;
    svg.transition().duration(550).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

// hover tooltip
node.on("mouseenter", (e, d) => {
  const neigh = [...(connected.get(d.id) || [])];
  const neighStr = neigh.length ? neigh.map(n => esc(n)).join(", ") : "—";
  const cols = d.cols.map(c => {
    let cls = ""; let tag = "";
    if (c.f && c.f.includes("pk")) { cls = "pk"; tag = "PK "; }
    else if (c.f && c.f.includes("fk")) { cls = "fk"; tag = "FK "; }
    else if (c.f && c.f.includes("uq")) { cls = "uq"; tag = "UQ "; }
    const typeStr = c.type ? ` <span style="color:#7d8590">:${c.type}</span>` : "";
    return `<div><span class="${cls}">${tag}</span>${esc(c.n)}${typeStr}</div>`;
  }).join("");
  tooltip.innerHTML =
    `<div class="tt-name">${esc(d.label)}</div>` +
    `<div class="tt-domain" style="color:${d.color}">${esc(DOMAIN_LABEL[d.domain])} · ${d.cols.length} cols · ${d.degree} edges</div>` +
    `<div class="tt-cols">${cols}</div>` +
    `<div class="tt-fk">${neigh.length} related: ${neighStr}</div>`;
  tooltip.style.opacity = 1;
})
.on("mousemove", e => {
  const r = container.getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if (x + tw > r.width - 8) x = e.clientX - r.left - tw - 14;
  if (y + th > r.height - 8) y = e.clientY - r.top - th - 8;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
})
.on("mouseleave", () => { tooltip.style.opacity = 0; })
.on("click", (e, d) => { e.stopPropagation(); focusNode(d.id); });

svg.on("click", () => {
  selectedId = null;
  clearHighlight();
  document.getElementById("info-content").innerHTML =
    '<span class="empty">Click a table to inspect its columns &amp; relationships.</span>';
});

// ============================================================
// Search
// ============================================================
const searchInput = document.getElementById("search");
const searchResults = document.getElementById("search-results");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = "";
  if (!q) { searchResults.classList.remove("active"); return; }
  const matches = nodes.filter(n => n.id.toLowerCase().includes(q)).slice(0, 30);
  if (!matches.length) { searchResults.classList.remove("active"); return; }
  searchResults.classList.add("active");
  matches.forEach(n => {
    const el = document.createElement("div");
    el.className = "search-item";
    el.innerHTML = `<span class="swatch" style="background:${n.color}"></span><span>${esc(n.id)}</span><span style="color:#5c6675;margin-left:auto">${esc(DOMAIN_LABEL[n.domain])}</span>`;
    el.onclick = () => {
      focusNode(n.id);
      searchResults.classList.remove("active");
      searchInput.value = "";
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener("click", e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.classList.remove("active");
});

// ============================================================
// Legend — domain toggle (hide/show nodes + their edges)
// ============================================================
const hiddenDomains = new Set();
const legendEl = document.getElementById("legend");
const selectAllCb = document.getElementById("select-all");
const selectAllLabel = document.getElementById("select-all-label");

DOMAINS.forEach(d => {
  const item = document.createElement("div");
  item.className = "legend-item";
  const count = tableByDomain[d.id].length;
  item.innerHTML =
    `<span class="legend-dot" style="background:${d.color}"></span>` +
    `<span class="legend-label">${esc(d.label)}</span>` +
    `<span class="legend-count">${count}</span>`;
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "cb"; cb.checked = true;
  cb.addEventListener("change", () => {
    if (cb.checked) { hiddenDomains.delete(d.id); item.classList.remove("dimmed"); }
    else { hiddenDomains.add(d.id); item.classList.add("dimmed"); }
    applyDomainVisibility();
    updateSelectAll();
  });
  item.prepend(cb);
  item.onclick = e => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event("change"));
  };
  legendEl.appendChild(item);
});

function applyDomainVisibility() {
  node.attr("display", d => hiddenDomains.has(d.domain) ? "none" : null);
  link.attr("display", d => {
    const s = d.source.id || d.source, t = d.target.id || d.target;
    return (hiddenDomains.has(nodeById[s].domain) || hiddenDomains.has(nodeById[t].domain)) ? "none" : null;
  });
  labelG.selectAll("text").attr("display", d => {
    const s = d.source.id || d.source, t = d.target.id || d.target;
    return (hiddenDomains.has(nodeById[s].domain) || hiddenDomains.has(nodeById[t].domain)) ? "none" : null;
  });
}

function updateSelectAll() {
  const hidden = hiddenDomains.size, total = DOMAINS.length;
  selectAllCb.checked = hidden === 0;
  selectAllLabel.textContent = hidden === 0 ? "Select all" : `Select all (${total - hidden}/${total})`;
}
selectAllCb.addEventListener("change", () => {
  const show = selectAllCb.checked;
  hiddenDomains.clear();
  if (!show) DOMAINS.forEach(d => hiddenDomains.add(d.id));
  document.querySelectorAll("#legend .legend-item").forEach((item, i) => {
    const cb = item.querySelector("input.cb");
    cb.checked = show;
    item.classList.toggle("dimmed", !show);
  });
  applyDomainVisibility();
  updateSelectAll();
});

// initial fit once layout settles
sim.on("end", fit);
setTimeout(fit, 2200);
</script>
</body>
</html>
